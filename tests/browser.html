<!doctype html><meta charset="utf-8"><title>APEX feature verification</title>
<style>body{background:#152019;color:#e8f1dc;font:14px system-ui;margin:20px}button,select{padding:10px;margin:5px}iframe{width:1280px;height:800px;border:1px solid #708263}#results{white-space:pre-wrap}.stage{position:relative;width:1280px;height:720px}.stage canvas{width:100%;height:100%}</style>
<h1>APEX feature verification</h1>
<p>Uses a separate test save. Your paddock data is untouched.</p>
<button id="run">Run UI checks</button><button id="scene">Show racing scene</button>
<select id="weather"><option>Clear</option><option>Overcast</option><option>Light rain</option><option>Heavy rain</option></select>
<select id="track"><option value="0">Verdant</option><option value="1">Coastal</option><option value="2">Alpine</option></select>
<button id="corner">Next sector</button><button id="ghost">Show ghost</button>
<pre id="results">Ready</pre><iframe id="app" title="Isolated simulator test" src="/?test=1"></iframe>
<div class="stage" hidden><canvas id="view"></canvas></div>
<script type="module" src="./browser.js"></script>
